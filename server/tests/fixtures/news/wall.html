<!doctype html>
<!-- A page that can't be read in-app: a consent wall over an app shell that draws itself with
     scripts. It has an og:image, but no article text. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta property="og:image" content="/images/wall-og.jpg">
  <title>Example Times</title>
</head>
<body>
  <div id="consent" role="dialog"><p>We value your privacy. Accept our cookies to keep reading the news on this site.</p><button>Accept</button></div>
  <div id="root"></div>
  <noscript><p>Please turn on JavaScript to read this article in full on our website.</p></noscript>
  <script src="/static/app.js"></script>
</body>
</html>
